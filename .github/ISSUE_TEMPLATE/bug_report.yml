name: Bug Report
description: Something is broken
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: Screen Affected
      options:
        - Login
        - Staff Accounts (admin)
        - New Order
        - Modify Order
        - Checkout
        - Refund (admin)
        - Transaction Logs
        - Owner Menu (admin)
        - Inventory (admin)
        - Staff Menu
        - Active Orders Queue
        - Reports
        - Export Reports
        - Other / N/A
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
