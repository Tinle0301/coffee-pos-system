name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'supabase/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/check-frontend.mjs'
              - '.github/workflows/ci.yml'

  backend-copy:
    name: Backend copy in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend/src/backend matches backend
        run: node scripts/sync-backend.mjs --check

  backend:
    name: SQL checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # POS-42: build the database from our migrations and run every
      # backend/tests/*.sql check file. Any failing check fails the PR.
      - name: Run migrations and every SQL check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/run-sql-checks.sh

  frontend:
    name: Frontend checks and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/src/package-lock.json

      # POS-59: conflict markers, syntax errors and broken imports each blank
      # the whole live site, so check for them first (takes a second).
      - name: Check frontend files (conflict markers, syntax, imports)
        run: node ../../scripts/check-frontend.mjs

      - name: Install
        run: npm ci

      # POS-59: every *.test.js in frontend/src. Any failing test fails the PR.
      - name: Run frontend tests
        run: npx vitest run
