<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Order</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <header class="order-header">
    <div class="order-header-left">
      <svg viewBox="0 0 48 48" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 18H34V30C34 35.5 29.5 40 24 40C18.5 40 14 35.5 14 30V18Z" stroke="currentColor" stroke-width="2.5"/>
        <path d="M34 20H38C40.2 20 42 21.8 42 24C42 26.2 40.2 28 38 28H34" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <span class="order-title">New Order</span>
    </div>
    <div class="order-header-right">
      <span id="employee-name" class="order-employee"></span>
      <button type="button" id="logout-btn" class="btn-secondary btn-small">Log out</button>
    </div>
  </header>

  <main class="order-layout">
    <section class="menu-panel" aria-label="Menu">
      <div id="menu-sections"></div>
    </section>

    <aside class="order-panel" aria-label="Current order">
      <h2 class="order-panel-title">Order</h2>
      <ul id="order-list" class="order-list"></ul>
      <p id="order-empty" class="order-empty">No items added yet.</p>
    </aside>
  </main>

  <!-- Customization modal -->
  <div id="customize-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="customize-title">
      <h2 id="customize-title" class="modal-title"></h2>

      <fieldset class="modal-field">
        <legend class="field-label">Size</legend>
        <div id="size-options" class="option-row"></div>
      </fieldset>

      <fieldset class="modal-field">
        <legend class="field-label">Milk</legend>
        <div id="milk-options" class="option-row"></div>
      </fieldset>

      <fieldset class="modal-field">
        <legend class="field-label">Add-ons</legend>
        <div id="addon-options" class="option-col"></div>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn-secondary">Cancel</button>
        <button type="button" id="modal-add" class="btn-primary">Add to order</button>
      </div>
    </div>
  </div>

  <script type="module" src="Neworder.js"></script>
</body>
</html>
