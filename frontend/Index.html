<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="login-screen">
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 18H34V30C34 35.5 29.5 40 24 40C18.5 40 14 35.5 14 30V18Z" stroke="currentColor" stroke-width="2.5"/>
          <path d="M34 20H38C40.2 20 42 21.8 42 24C42 26.2 40.2 28 38 28H34" stroke="currentColor" stroke-width="2.5"/>
          <path d="M17 12C17 10 19 10 19 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M23 12C23 10 25 10 25 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M29 12C29 10 31 10 31 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="login-title">Start your shift</h1>
      <p class="login-subtitle">Sign in to open the register.</p>

      <form id="login-form" class="login-form" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input
            type="email"
            id="email"
            name="email"
            inputmode="email"
            autocomplete="username"
            required
          />
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>

        <p id="login-error" class="login-error" role="alert" hidden></p>

        <button type="submit" id="login-submit" class="btn-primary">
          <span class="btn-label">Log in</span>
        </button>
      </form>

      <div class="login-success" id="login-success" hidden>
        <p class="login-success-text">
          Welcome back, <span id="success-name"></span>. Opening the register…
        </p>
        <button type="button" id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </div>
  </main>

  <script type="module" src="Login.js"></script>
</body>
</html>
